version: '3'
services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - PYTHONPATH=/app

  ui:
    build: .
    ports:
      - "8501:8501"
    environment:
      - PYTHONPATH=/app
    command: streamlit run app_ui.py --server.port 8501 --server.address 0.0.0.0
    depends_on:
      - api

networks:
  default:
    driver: bridge 

volumes:
  app_data:
  app_logs:
